<main>
<section>
<h2>Raise a query</h2>
<form id="qf" novalidate>
<div class="f"><label for="name">Full name *</label><input id="name" autocomplete="name" required></div>
<div class="f"><label for="phone">Mobile number *</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit number" required></div>
<div class="f"><label for="area">Address / area in Udaipur</label><input id="area" autocomplete="street-address"></div>
<div class="f"><label for="ptype">Property type</label><select id="ptype"><option>House</option><option>Apartment / flat</option><option>Shop or business</option><option>Other</option></select></div>
<div class="f"><label for="bill">Monthly electricity bill (&#8377;), if known</label><input id="bill" type="number" inputmode="numeric" min="0"></div>
<div class="f full"><label for="query">Your query *</label><textarea id="query" required placeholder="For example: I want solar for my 2-floor house. What would it need?"></textarea></div>
<div class="f full row"><button class="btn" type="submit" id="send">Submit query</button></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="f full hint">Your details are used only so we can contact you about your solar enquiry.</div>
</form>
</section>
